name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Lint has pre-existing errors in unrelated files, tracked separately.
      # Kept non-blocking here so it doesn't gate this task's CI.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
